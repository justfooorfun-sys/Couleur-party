<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Couleur de la soirée</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" type="image/png" href="logo.png">

<style>
:root{
  --bg1:#0f172a;
  --bg2:#020617;
  --card:#0b1220;
  --border:#1f2937;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --accent:#6366f1;
}
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at top,#1e293b,var(--bg2));
  font-family:system-ui,-apple-system;
  display:flex;
  justify-content:center;
  padding:1.3rem;
  color:var(--text);
}
.container{width:100%;max-width:480px}
h1{
  text-align:center;
  font-weight:900;
  margin:.4rem 0 .2rem;
  background:linear-gradient(90deg,#f97316,#22c55e,#3b82f6,#ec4899);
  -webkit-background-clip:text;
  color:transparent;
}
.subtitle{
  text-align:center;
  font-size:.88rem;
  color:var(--muted);
  margin-bottom:1rem;
}
.counter{
  text-align:center;
  font-size:.85rem;
  color:var(--muted);
  margin-bottom:.7rem;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:1rem;
  padding:1.1rem;
  box-shadow:0 20px 40px rgba(0,0,0,.55);
}
label{
  display:block;
  font-weight:600;
  font-size:.9rem;
  margin-bottom:.25rem;
}
select,input{
  width:100%;
  background:#020617;
  color:var(--text);
  border:1px solid #334155;
  border-radius:.6rem;
  padding:.55rem .7rem;
  margin-bottom:.75rem;
}
button{
  width:100%;
  border:none;
  border-radius:999px;
  padding:.6rem;
  background:linear-gradient(135deg,#6366f1,#4338ca);
  color:white;
  font-weight:700;
  cursor:pointer;
}
.result{
  margin-top:1rem;
  background:#020617;
  border:1px solid #334155;
  border-radius:.75rem;
  padding:.9rem;
}
.big{
  font-size:1.2rem;
  font-weight:800;
}
.small{
  font-size:.8rem;
  color:var(--muted);
}
</style>
</head>

<p class="subtitle">Entre ton prénom pour découvrir ta couleur 🎉</p>
<div id="counter" class="counter">Chargement…</div>

<input id="extra" placeholder="Ton prénom">

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Couleur de la soirée</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg1:#0f172a;
  --bg2:#020617;
  --card:#ffffff;
  --accent:#6366f1;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(180deg,var(--bg1),var(--bg2));
  font-family:system-ui,-apple-system;
  display:flex;
  justify-content:center;
  padding:1.5rem;
}
.container{width:100%;max-width:720px}
h1{color:white;text-align:center;font-weight:800;margin:0.3rem 0}
.subtitle{text-align:center;color:#cbd5f5;margin-bottom:1.3rem}
.card{
  background:var(--card);
  border-radius:1.2rem;
  padding:1.4rem 1.6rem;
  box-shadow:0 20px 50px rgba(0,0,0,.45)
}
.counter{text-align:center;color:#cbd5f5;font-size:.9rem;margin-bottom:1rem}
label{font-weight:600;display:block;margin-bottom:.3rem}
select,input{
  width:100%;padding:.55rem .7rem;border-radius:.7rem;
  border:1px solid #cbd5e1;margin-bottom:.9rem
}
button{
  width:100%;padding:.7rem;border-radius:999px;
  background:linear-gradient(135deg,#6366f1,#4338ca);
  color:white;border:none;font-weight:700;cursor:pointer
}
.result{
  margin-top:1rem;background:#f8fafc;
  border:1px solid #e5e7eb;border-radius:.9rem;padding:1rem
}
</style>
</head>

<body>
<div class="container">
<h1>🎉 Couleur de la soirée</h1>
<p class="subtitle">Choisis ton prénom ou saisis-le pour découvrir ta couleur</p>
<div id="counter" class="counter">Chargement…</div>

<div class="card">
<label>Prénom dans la liste</label>
<select id="selectName">
  <option value="">— Sélectionne ton prénom —</option>
</select>

<label>Ou entre ton prénom</label>
<input id="inputName" placeholder="Ton prénom">

<button id="btn">Voir ma couleur</button>
<div id="result" class="result" style="display:none;"></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { getDatabase, ref, get, set, update, onValue } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

/* 🔥 CONFIG FIREBASE */
const firebaseConfig={
  apiKey:"AIzaSyAoeP4PnoI2_sBTiDvfadJ4kewngGbkkDo",
  authDomain:"couleur-party-b315b.firebaseapp.com",
  databaseURL:"https://couleur-party-b315b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"couleur-party-b315b",
  storageBucket:"couleur-party-b315b.firebasestorage.app",
  messagingSenderId:"420983408934",
  appId:"1:420983408934:web:ad2c108cb13c480b0f19e7"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

/* BASE */
const baseNames=["Léo","Aurélien","Julien","Thomas","Rémi","Joris T","Roméo","Camille","Anna","Sarah","Charlotte","Marie"];
const colors=["Rouge Vif","Bleu Électrique","Vert Émeraude","Jaune Soleil","Orange","Rose Fushia","Violet Profond","Noir","Blanc Pur","Argenté"];

const select=document.getElementById("selectName");
const input=document.getElementById("inputName");
const result=document.getElementById("result");
const counter=document.getElementById("counter");

/* init select */
baseNames.forEach(n=>{
  const o=document.createElement("option");
  o.value=n;o.textContent=n;
  select.appendChild(o);
});

const keyOf=n=>n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");

/* INIT FIREBASE DATA */
async function init(){
  const invSnap=await get(ref(db,"invites"));
  if(!invSnap.exists()){
    let shuffled=[...baseNames].sort(()=>Math.random()-0.5);
    let invites={};
    while(shuffled.length>=2){
      const a=shuffled.pop(),b=shuffled.pop();
      const c=colors[Math.floor(Math.random()*colors.length)];
      invites[keyOf(a)]={name:a,color:c,partner:b,revealed:false};
      invites[keyOf(b)]={name:b,color:c,partner:a,revealed:false};
    }
    await set(ref(db,"invites"),invites);
    await set(ref(db,"extras"),{pending:null,color:null});
  }
}
init();

/* COUNTER = revealed only */
onValue(ref(db,"invites"),snap=>{
  if(!snap.exists()) return;
  const n=Object.values(snap.val()).filter(v=>v.revealed).length;
  counter.textContent=
    n+" personne"+(n>1?"s ont révélé leur couleur":" a révélé sa couleur");
});

/* ACTION */
document.getElementById("btn").onclick=async()=>{
  try{
    const name=select.value||input.value.trim();
    if(!name) return alert("Entre ton prénom");

    const key=keyOf(name);
    const snap=await get(ref(db,"invites/"+key));

    let data;
    if(snap.exists()){
      data=snap.val();
      if(!data.revealed){
        await update(ref(db,"invites/"+key),{revealed:true});
        data.revealed=true;
      }
    } else {
      const extraSnap=await get(ref(db,"extras"));
      const state=extraSnap.exists()?extraSnap.val():{pending:null,color:null};

      if(!state.pending){
        const color=colors[Math.floor(Math.random()*colors.length)];
        await set(ref(db,"invites/"+key),{
          name,color,partner:null,revealed:true
        });
        await set(ref(db,"extras"),{pending:key,color});
        data={name,color,partner:null};
      } else {
        const partnerSnap=await get(ref(db,"invites/"+state.pending));
        const partnerName=partnerSnap.val().name;
        await update(ref(db,"invites/"+state.pending),{partner:name});
        await set(ref(db,"invites/"+key),{
          name,color:state.color,partner:partnerName,revealed:true
        });
        await set(ref(db,"extras"),{pending:null,color:null});
        data={name,color:state.color,partner:partnerName};
      }
    }

    result.style.display="block";
    result.innerHTML=`
      <strong>${data.name}</strong>, ta couleur est :
      <div style="font-size:1.2rem;font-weight:700;margin:.3rem 0">${data.color}</div>
      ${data.partner?`🤝 En paire avec <strong>${data.partner}</strong>`:"✨ En attente de partenaire"}
    `;
  } catch(e){
    alert("Erreur : "+e.message);
    console.error(e);
  }
};
</script>
</body>
</html>
